                                <span className={`inline-block text-xs font-black px-3 py-0.5 rounded-full border ${world.badgeColor}`}>{world.subtitle}</span>
                                <h2 className="text-2xl font-black text-brand-deep">{world.subjectTitle}</h2>
                                <div className="bg-orange-50 border-l-4 border-orange-400 p-2.5 rounded-r-xl text-xs font-bold text-slate-700">
                                    <span className="text-orange-600 font-black uppercase mr-1">Identification:</span>{world.modelText.identification}
                                </div>
                                <div className="bg-blue-50 border-l-4 border-blue-500 p-2.5 rounded-r-xl text-xs font-semibold text-slate-700">
                                    <span className="text-blue-600 font-black uppercase mr-1">Description:</span>{world.modelText.description}
                                </div>
                            </div>
                        </div>

                        <div className={`grid grid-cols-1 ${world.categories.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-3`}>
                            {world.categories.map(cat => (
                                <div key={cat.id} className={`rounded-xl border-2 overflow-hidden ${cat.color}`}>
                                    <div className={`${cat.headerBg} text-white font-black px-3 py-1.5 text-xs`}>{cat.icon} {cat.label}</div>
                                    <div className="p-2 flex flex-wrap gap-1.5">
                                        {world.sortItems.filter(i => i.category === cat.id).map(item => (
                                            <span key={item.id} className="bg-white px-2 py-1 rounded-lg text-[11px] font-bold text-slate-700 border border-slate-200">{item.text}</span>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <button type="button" onClick={onComplete} className="w-full btn-3d btn-primary py-3 text-base">
                            NEXT: INTERACTIVE DRAG & DROP 🧲 (+20 Pts)
                        </button>
                    </div>
                </div>
            </div>
        );

        const ScreenDragDropSorter = ({ world, locked, syncedState, onSyncState, showModal, onBack, onComplete }) => {
            const [placements, setPlacements] = useState({}); // itemId -> categoryId
            const [selectedItem, setSelectedItem] = useState(null);
            const [dragOverCat, setDragOverCat] = useState(null);
            const [checkedStatus, setCheckedStatus] = useState(null);

            useEffect(() => {
                setPlacements({});
                setSelectedItem(null);
                setCheckedStatus(null);
            }, [world.id]);

            useEffect(() => {
                if (syncedState?.placements) {
                    setPlacements(syncedState.placements);
                    setCheckedStatus(null);
                }
            }, [syncedState?.ts]);

            const bank = world.sortItems.filter(i => !placements[i.id]);

            const moveItemToCategory = (itemId, targetCatId) => {
                setCheckedStatus(null);
                const next = { ...placements };
                if (targetCatId === 'bank') delete next[itemId];
                else next[itemId] = targetCatId;
                setPlacements(next);
                setSelectedItem(null);
                if (onSyncState) onSyncState({ placements: next });
            };

            const handleCheck = () => {
                if (bank.length > 0) {
                    showModal("Almost There! 🧲", `Please sort all remaining ${bank.length} card(s) first.`, "info");
                    return;
                }
                const statusMap = {};
                let correctCount = 0;
                world.sortItems.forEach(item => {
                    const isRight = placements[item.id] === item.category;
                    statusMap[item.id] = isRight;
                    if (isRight) correctCount++;
                });
                setCheckedStatus(statusMap);
                if (correctCount === world.sortItems.length) {
                    showModal("Awesome Job! 🌟", `All ${correctCount} phrases about ${world.subjectTitle} are correct!`, "success", onComplete);
                } else {
                    showModal("Keep Trying! 🔍", `${correctCount}/${world.sortItems.length} correct. Move red cards to the right box!`, "error");
                }
            };

            return (
                <div className={`flex-1 p-3 ${world.themeBg} overflow-y-auto`}>
                    <div className="max-w-5xl mx-auto">
                        <div className="flex justify-between items-center mb-2">
                            {!locked ? (
                                <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_3px_0_#cbd5e1] px-3 py-1 text-xs">
                                    ⬅️ Back
                                </button>
                            ) : <div />}
                            {syncedState?.by && (
                                <span className="bg-emerald-100 text-emerald-800 text-xs font-black px-3 py-1 rounded-full border border-emerald-300">
                                    ✨ Update Live oleh: {syncedState.by}
                                </span>
                            )}
                        </div>

                        <div className="game-card p-4 space-y-3">
                            <div className="flex items-center justify-between gap-3">
                                <h2 className="text-lg md:text-xl font-black text-brand-deep">🧲 Drag & Drop: {world.subjectTitle}</h2>
                                <span className="text-xs font-bold text-blue-600 hidden sm:inline">Seret kartu atau klik kartu lalu klik kotak tujuan</span>
                            </div>

                            <div className={`grid grid-cols-1 ${world.categories.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-3`}>
                                {world.categories.map(cat => {
                                    const catItems = world.sortItems.filter(i => placements[i.id] === cat.id);
                                    return (
                                        <div
                                            key={cat.id}
                                            onDragOver={(e) => { e.preventDefault(); setDragOverCat(cat.id); }}
                                            onDragLeave={() => setDragOverCat(null)}
                                            onDrop={(e) => {
                                                e.preventDefault();
                                                setDragOverCat(null);
                                                const id = e.dataTransfer.getData('text/plain') || selectedItem;
                                                if (id) moveItemToCategory(id, cat.id);
                                            }}
                                            onClick={() => { if (selectedItem) moveItemToCategory(selectedItem, cat.id); }}
                                            className={`drop-zone rounded-2xl border-4 border-dashed min-h-[135px] flex flex-col overflow-hidden ${cat.color} ${dragOverCat === cat.id ? 'drag-over' : ''}`}
                                        >
                                            <div className={`${cat.headerBg} text-white font-black px-3 py-1.5 text-xs flex justify-between`}>
                                                <span>{cat.icon} {cat.label}</span>
                                                <span>{catItems.length}</span>
                                            </div>
                                            <div className="p-2 flex flex-wrap gap-1.5">
                                                {catItems.map(item => {
                                                    const st = checkedStatus ? checkedStatus[item.id] : null;
                                                    return (
                                                        <button
                                                            key={item.id}
                                                            type="button"
                                                            draggable
                                                            onDragStart={(e) => e.dataTransfer.setData('text/plain', item.id)}
                                                            onClick={(e) => { e.stopPropagation(); moveItemToCategory(item.id, 'bank'); }}
                                                            className={`drag-chip px-2.5 py-1 rounded-lg font-bold text-xs border-2 ${
                                                                st === true ? 'bg-green-100 border-green-500 text-green-900' :
                                                                st === false ? 'bg-red-100 border-red-500 text-red-900' :
                                                                'bg-white border-slate-200 text-slate-800'
                                                            }`}
                                                        >
                                                            {item.text} {st === true ? '✅' : st === false ? '❌' : '↩️'}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="bg-slate-100 rounded-xl p-3 border-2 border-slate-300">
                                <div className="text-xs font-black text-slate-600 mb-2">📦 Phrase Bank ({bank.length} tersisa)</div>
                                <div className="flex flex-wrap gap-1.5">
                                    {bank.map(item => (
                                        <button
                                            key={item.id}
                                            type="button"
                                            draggable
                                            onDragStart={(e) => { e.dataTransfer.setData('text/plain', item.id); setSelectedItem(item.id); }}
                                            onClick={() => setSelectedItem(selectedItem === item.id ? null : item.id)}
                                            className={`drag-chip px-2.5 py-1.5 rounded-lg font-bold text-xs border-2 ${
                                                selectedItem === item.id ? 'bg-brand-yellow border-yellow-600 text-yellow-950' : 'bg-white border-slate-300 text-slate-800'
                                            }`}
                                        >
                                            {item.text}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div className="flex gap-2">
                                <button type="button" onClick={() => { setPlacements({}); setCheckedStatus(null); if (onSyncState) onSyncState({ placements: {} }); }} className="w-1/3 btn-3d bg-slate-200 text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#94a3b8] py-2.5 text-sm">
                                    🔄 RESET
                                </button>
                                <button type="button" onClick={handleCheck} className="w-2/3 btn-3d btn-primary py-2.5 text-sm">
                                    ✅ CHECK ANSWERS
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenGrammar = ({ data, title = "Grammar Detective", world = null, locked = false, syncedState = null, onSyncState = null, onBack, onComplete, showModal, isFinal = false }) => {
            const [currentQ, setCurrentQ] = useState(0);
            const [lastPicked, setLastPicked] = useState(null);

            useEffect(() => { setCurrentQ(0); setLastPicked(null); }, [data]);
            useEffect(() => {
                if (typeof syncedState?.currentQ === 'number') setCurrentQ(syncedState.currentQ);
                if (syncedState?.picked !== undefined) setLastPicked(syncedState.picked);
            }, [syncedState?.ts]);

            const handleAnswer = (index) => {
                const q = data[currentQ];
                setLastPicked(index);
                if (onSyncState) onSyncState({ currentQ, picked: index });

                if (index === q.correct) {
                    showModal("Correct! 🎯", q.exp || "Great job!", "success", () => {
                        if (currentQ < data.length - 1) {
                            const nextQ = currentQ + 1;
                            setCurrentQ(nextQ);
                            setLastPicked(null);
                            if (onSyncState) onSyncState({ currentQ: nextQ, picked: null });
                        } else {
                            onComplete();
                        }
                    });
                } else {
                    showModal("Not Quite ❌", `Hint: ${q.exp || "Check grammar!"}`, "error");
                }
            };

            const q = data[currentQ] || data[0];

            return (
                <div className={`flex-1 p-4 flex flex-col items-center justify-center ${isFinal ? 'bg-gradient-to-b from-red-900 to-slate-900' : (world ? world.themeBg : 'bg-slate-800')}`}>
                    <div className="w-full max-w-2xl mb-2 flex justify-between items-center">
                        {!locked ? (
                            <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_3px_0_#cbd5e1] px-3 py-1 text-xs">
                                ⬅️ Back
                            </button>
                        ) : <div />}
                        <div className="flex items-center gap-2">
                            {syncedState?.by && (
                                <span className="bg-emerald-100 text-emerald-800 text-xs font-black px-2.5 py-0.5 rounded-full">
                                    ✨ Dijawab oleh: {syncedState.by}
                                </span>
                            )}
                            <span className={`font-black text-sm ${isFinal ? 'text-yellow-300' : 'text-slate-700'}`}>{currentQ + 1} / {data.length}</span>
                        </div>
                    </div>

                    <div className="game-card w-full max-w-2xl p-5 animate-pop">
                        <div className="text-center mb-3">
                            <span className="text-3xl">{isFinal ? '👑' : '🔍'}</span>
                            <div className="text-xs font-black uppercase text-brand-purple">{title}</div>
                        </div>
                        <h3 className="text-lg md:text-xl font-black text-slate-800 mb-4 text-center">{q.q}</h3>
                        <div className="space-y-2.5">
                            {q.options.map((opt, i) => (
                                <button
                                    key={i}
                                    type="button"
                                    onClick={() => handleAnswer(i)}
                                    className={`w-full btn-3d py-3 text-left px-4 text-sm md:text-base justify-start ${lastPicked === i ? 'btn-primary' : 'btn-secondary'}`}
                                >
                                    <span className="bg-white/75 text-blue-900 w-7 h-7 rounded-full inline-flex items-center justify-center mr-3 font-black shrink-0">
                                        {String.fromCharCode(65 + i)}
                                    </span>
                                    <span className="normal-case">{opt}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenSentenceBuilder = ({ world, locked, syncedState, onSyncState, onBack, onComplete, showModal }) => {
            const data = world.sentences;
            const [currentQ, setCurrentQ] = useState(0);
            const [selectedWords, setSelectedWords] = useState([]);
            const [availableWords, setAvailableWords] = useState([]);

            const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);

            useEffect(() => { setCurrentQ(0); }, [world.id]);
            useEffect(() => {
                setAvailableWords(shuffle(data[currentQ].words));
                setSelectedWords([]);
            }, [currentQ, data]);

            useEffect(() => {
                if (!syncedState) return;
                if (typeof syncedState.currentQ === 'number') setCurrentQ(syncedState.currentQ);
                if (Array.isArray(syncedState.selectedWords)) setSelectedWords(syncedState.selectedWords);
                if (Array.isArray(syncedState.availableWords)) setAvailableWords(syncedState.availableWords);
            }, [syncedState?.ts]);

            const handleSelect = (word, index) => {
                const nextSel = [...selectedWords, word];
                const nextAvail = availableWords.filter((_, i) => i !== index);
                setSelectedWords(nextSel);
                setAvailableWords(nextAvail);
                if (onSyncState) onSyncState({ currentQ, selectedWords: nextSel, availableWords: nextAvail });
            };

            const handleDeselect = (word, index) => {
                const nextAvail = [...availableWords, word];
                const nextSel = selectedWords.filter((_, i) => i !== index);
                setAvailableWords(nextAvail);
                setSelectedWords(nextSel);
                if (onSyncState) onSyncState({ currentQ, selectedWords: nextSel, availableWords: nextAvail });
            };

            const handleCheck = () => {
                const answer = selectedWords.join(" ");
                if (answer === data[currentQ].correct) {
                    showModal("Amazing! ⭐", `Correct sentence:\n"${answer}"`, "success", () => {
                        if (currentQ < data.length - 1) {
                            const nextQ = currentQ + 1;
                            const nextAvail = shuffle(data[nextQ].words);
                            setCurrentQ(nextQ);
                            setSelectedWords([]);
                            setAvailableWords(nextAvail);
                            if (onSyncState) onSyncState({ currentQ: nextQ, selectedWords: [], availableWords: nextAvail });
                        } else {
                            onComplete();
                        }
                    });
                } else {
                    showModal("Not Quite! 🚧", "Check the word order carefully and try again.", "error");
                }
            };

            return (
                <div className={`flex-1 p-4 ${world.themeBg} flex flex-col items-center justify-center`}>
                    <div className="w-full max-w-3xl mb-2 flex justify-between items-center">
                        {!locked ? (
                            <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_3px_0_#cbd5e1] px-3 py-1 text-xs">
                                ⬅️ Back
                            </button>
                        ) : <div />}
                        <div className="flex items-center gap-2">
                            {syncedState?.by && <span className="bg-emerald-100 text-emerald-800 text-xs font-black px-2.5 py-0.5 rounded-full">✨ Update: {syncedState.by}</span>}
                            <span className="font-black text-slate-600 text-xs">Sentence {currentQ + 1} / {data.length}</span>
                        </div>
                    </div>

                    <div className="game-card w-full max-w-3xl p-5 animate-pop">
                        <div className="text-center mb-3">
                            <span className={`inline-block text-xs font-black px-3 py-0.5 rounded-full border mb-1 ${world.badgeColor}`}>🧩 Sentence Builder • {world.subjectTitle}</span>
                            <h2 className="text-xl font-black text-brand-deep">Arrange the Words!</h2>
                        </div>

                        <div className="bg-slate-100 rounded-2xl min-h-[76px] p-3 flex flex-wrap gap-2 mb-4 border-4 border-dashed border-slate-300 items-center justify-center">
                            {selectedWords.length === 0 && <span className="text-slate-400 font-bold text-xs">Tap words below to build a sentence...</span>}
                            {selectedWords.map((word, i) => (
                                <button key={`sel-${i}`} type="button" onClick={() => handleDeselect(word, i)} className="bg-brand-yellow text-yellow-950 font-black px-3 py-1.5 rounded-xl shadow-[0_3px_0_#ca8a04] text-sm">
                                    {word}
                                </button>
                            ))}
                        </div>

                        <div className="flex flex-wrap gap-2 justify-center mb-5">
                            {availableWords.map((word, i) => (
                                <button key={`avail-${i}`} type="button" onClick={() => handleSelect(word, i)} className="bg-white text-slate-800 font-black px-3 py-1.5 rounded-xl border-2 border-slate-300 shadow-[0_3px_0_#cbd5e1] text-sm">
                                    {word}
                                </button>
                            ))}
                        </div>

                        <div className="flex gap-3">
                            <button type="button" onClick={() => {
                                const nextAvail = shuffle(data[currentQ].words);
                                setAvailableWords(nextAvail);
                                setSelectedWords([]);
                                if (onSyncState) onSyncState({ currentQ, selectedWords: [], availableWords: nextAvail });
                            }} className="flex-1 btn-3d bg-slate-200 text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#94a3b8] py-2.5 text-sm">
                                🔄 RESET
                            </button>
                            <button type="button" onClick={handleCheck} disabled={availableWords.length > 0} className="flex-[2] btn-3d btn-primary py-2.5 text-sm">
                                ✅ CHECK ANSWER
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ScreenWritingBuilder = ({ world, locked, syncedState, onSyncState, showModal, onBack, onSaveWriting, onComplete }) => {
            const [paragraphText, setParagraphText] = useState(world.identificationIntro + " ");
            const [usedIds, setUsedIds] = useState([]);

            useEffect(() => {
                setParagraphText(world.identificationIntro + " ");
                setUsedIds([]);
            }, [world.id]);

            useEffect(() => {
                if (typeof syncedState?.paragraphText === 'string') setParagraphText(syncedState.paragraphText);
            }, [syncedState?.ts]);

            const addSentenceToBox = (item) => {
                const nextText = paragraphText.trim() ? `${paragraphText.trim()} ${item.text}` : item.text;
                setParagraphText(nextText);
                if (!usedIds.includes(item.id)) setUsedIds(prev => [...prev, item.id]);
                if (onSyncState) onSyncState({ paragraphText: nextText });
            };

            const wordCount = paragraphText.trim().split(/\s+/).filter(Boolean).length;

            const handleSubmit = () => {
                if (wordCount < 20) {
                    showModal("Add More Details! ✍️", "Click more phrases into the paragraph box (at least 20 words).", "info");
                    return;
                }
                onSaveWriting(paragraphText);
                showModal("Wonderful Paragraph! 🌟", `Saved ${wordCount} words about ${world.subjectTitle}!`, "success", onComplete);
            };

            return (
                <div className={`flex-1 p-3 ${world.themeBg} overflow-y-auto`}>
                    <div className="max-w-5xl mx-auto">
                        <div className="flex justify-between items-center mb-2">
                            {!locked ? (
                                <button type="button" onClick={onBack} className="btn-3d bg-white text-slate-700 border-2 border-slate-300 shadow-[0_3px_0_#cbd5e1] px-3 py-1 text-xs">
                                    ⬅️ Back
                                </button>
                            ) : <div />}
                            {syncedState?.by && <span className="bg-emerald-100 text-emerald-800 text-xs font-black px-2.5 py-0.5 rounded-full">✍️ Ditulis oleh: {syncedState.by}</span>}
                        </div>

                        <div className="game-card p-4 space-y-3">
                            <h2 className="text-lg font-black text-brand-deep">✍️ Writing Builder: {world.subjectTitle}</h2>

                            <div className={`grid grid-cols-1 ${world.categories.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-2.5`}>
                                {world.categories.map(cat => (
                                    <div key={cat.id} className={`rounded-xl border-2 overflow-hidden ${cat.color}`}>
                                        <div className={`${cat.headerBg} text-white font-black px-3 py-1 text-xs`}>{cat.icon} {cat.label}</div>
                                        <div className="p-2 flex flex-wrap gap-1">
                                            {world.sortItems.filter(i => i.category === cat.id).map(item => (
                                                <button
                                                    key={item.id}
                                                    type="button"
                                                    onClick={() => addSentenceToBox(item)}
                                                    className={`text-[11px] font-bold px-2 py-1 rounded-lg border ${usedIds.includes(item.id) ? 'bg-green-100 border-green-400 text-green-900' : 'bg-white border-slate-200 text-slate-800'}`}
                                                >
                                                    + {item.text}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="bg-blue-50/70 rounded-xl p-3 border-2 border-dashed border-brand-sky">
                                <div className="flex justify-between items-center mb-1">
                                    <span className="font-black text-brand-deep text-xs">📄 Paragraph Box</span>
                                    <span className="bg-white px-2 py-0.5 rounded-full text-[11px] font-black text-slate-600">Words: {wordCount}</span>
                                </div>
                                <textarea
                                    rows="4"
                                    value={paragraphText}
                                    onChange={(e) => {
                                        setParagraphText(e.target.value);
                                        if (onSyncState) onSyncState({ paragraphText: e.target.value });
                                    }}
                                    className="w-full p-2.5 rounded-xl border-2 border-slate-300 font-semibold text-slate-800 text-sm bg-white focus:outline-none focus:border-brand-deep"
                                />
                            </div>

                            <div className="flex gap-2">
                                <button type="button" onClick={() => { setParagraphText(world.identificationIntro + " "); setUsedIds([]); }} className="btn-3d bg-slate-200 text-slate-700 border-2 border-slate-300 shadow-[0_3px_0_#94a3b8] px-4 py-2 text-xs">
                                    🔄 Reset
                                </button>
                                <button type="button" onClick={handleSubmit} className="flex-1 btn-3d btn-primary py-2 text-sm">
                                    ✅ CHECK & SAVE PARAGRAPH (+50 Pts)
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 15. LIVE SHARED DRAG & DROP BOARD (ALL STUDENTS COLLABORATE LIVE)
        // =========================================================================
        const ScreenLiveSharedTask = ({ roomCode, roomData, isTeacherHost, actorName, onBack }) => {
            const worldId = roomData?.sharedTask?.worldId || 'people';
            const world = WORLDS_DATA[worldId] || WORLDS_DATA.people;
            const placements = roomData?.sharedTask?.placements || {};
            const [selectedItem, setSelectedItem] = useState(null);

            const moveCard = (itemId, catId) => {
                if (!roomCode) return;
                const next = { ...placements };
                if (catId === 'bank') delete next[itemId];
                else next[itemId] = { catId, by: actorName };
                window.FB_BRIDGE.upsertRoom(roomCode, {
                    sharedTask: { active: true, worldId, placements: next }
                });
                setSelectedItem(null);
            };

            const bank = world.sortItems.filter(i => !placements[i.id]);

            return (
                <div className={`flex-1 p-3 ${world.themeBg} overflow-y-auto`}>
                    <div className="max-w-5xl mx-auto space-y-3">
                        <div className="flex flex-wrap justify-between items-center gap-2">
                            <span className="bg-brand-purple text-white font-black px-3 py-1 rounded-full text-xs">
                                🔴 LIVE SHARED DRAG & DROP • {world.subjectTitle} (Terlihat Semua Orang)
                            </span>
                            {isTeacherHost && (
                                <div className="flex gap-2">
                                    <select
                                        value={worldId}
                                        onChange={(e) => window.FB_BRIDGE.upsertRoom(roomCode, { sharedTask: { active: true, worldId: e.target.value, placements: {} } })}
                                        className="bg-white border-2 border-slate-300 rounded-xl px-2 py-1 text-xs font-black"
                                    >
                                        {Object.values(WORLDS_DATA).map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
                                    </select>
                                    <button
                                        type="button"
                                        onClick={() => {
                                            window.FB_BRIDGE.upsertRoom(roomCode, { sharedTask: { active: false, worldId, placements: {} } });
                                            onBack();
                                        }}
                                        className="btn-3d btn-danger px-3 py-1 text-xs"
                                    >
                                        ⏹ Akhiri Tugas Bersama
                                    </button>
                                </div>
                            )}
                        </div>

                        <div className="game-card p-4 space-y-3">
                            <div className={`grid grid-cols-1 ${world.categories.length === 3 ? 'md:grid-cols-3' : 'md:grid-cols-2'} gap-3`}>
                                {world.categories.map(cat => {
                                    const items = world.sortItems.filter(i => placements[i.id]?.catId === cat.id);
                                    return (
                                        <div
                                            key={cat.id}
                                            onDragOver={e => e.preventDefault()}
                                            onDrop={e => {
                                                e.preventDefault();
                                                const id = e.dataTransfer.getData('text/plain') || selectedItem;
                                                if (id) moveCard(id, cat.id);
                                            }}
                                            onClick={() => { if (selectedItem) moveCard(selectedItem, cat.id); }}
                                            className={`drop-zone rounded-2xl border-4 border-dashed min-h-[140px] flex flex-col overflow-hidden ${cat.color}`}
                                        >
                                            <div className={`${cat.headerBg} text-white font-black px-3 py-1.5 text-xs flex justify-between`}>
                                                <span>{cat.icon} {cat.label}</span>
                                                <span>{items.length}</span>
                                            </div>
                                            <div className="p-2 flex flex-wrap gap-1.5">
                                                {items.map(item => (
                                                    <button
                                                        key={item.id}
                                                        type="button"
                                                        onClick={(e) => { e.stopPropagation(); moveCard(item.id, 'bank'); }}
                                                        className="bg-white border-2 border-slate-200 px-2.5 py-1 rounded-lg text-xs font-bold text-slate-800 shadow-sm"
                                                    >
                                                        {item.text} <span className="text-[10px] text-blue-600 font-black">({placements[item.id]?.by})</span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="bg-slate-100 rounded-xl p-3 border-2 border-slate-300">
                                <div className="text-xs font-black text-slate-600 mb-2">📦 Kartu Bersama ({bank.length} tersisa) — Klik/Seret agar terlihat semua peserta</div>
                                <div className="flex flex-wrap gap-1.5">
                                    {bank.map(item => (
                                        <button
                                            key={item.id}
                                            type="button"
                                            draggable
                                            onDragStart={e => { e.dataTransfer.setData('text/plain', item.id); setSelectedItem(item.id); }}
                                            onClick={() => setSelectedItem(selectedItem === item.id ? null : item.id)}
                                            className={`px-2.5 py-1.5 rounded-lg font-bold text-xs border-2 ${selectedItem === item.id ? 'bg-brand-yellow border-yellow-600' : 'bg-white border-slate-300'}`}
                                        >
                                            {item.text}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // =========================================================================
        // 16. BASE CAMP, TEAM PROJECT, REFLECTION, ACHIEVEMENTS, TEACHER DASHBOARD
        // =========================================================================
        const ScreenMaterial = ({ data, locked, onBack, onComplete }) => (
            <div className="flex-1 p-4 bg-brand-sky flex flex-col items-center justify-center">
                <div className="game-card max-w-2xl w-full p-6 animate-pop">
                    {!locked && <button type="button" onClick={onBack} className="text-xs font-black text-slate-500 mb-2">⬅️ Back to Map</button>}
                    <div className="text-center mb-4">
                        <span className="text-5xl">{data.icon}</span>
                        <h2 className="text-2xl font-black text-brand-deep mt-2">{data.title}</h2>
                    </div>
                    <div className="bg-blue-50 border-l-4 border-blue-500 p-4 rounded-r-2xl mb-4">
                        <p className="text-base text-slate-800 font-bold mb-3">{data.content}</p>
                        <div className="bg-white p-3 rounded-xl border border-blue-100 text-sm">
                            <span className="font-black text-blue-700 block">🎯 Social Function:</span>
                            <p className="text-slate-700 font-semibold">{data.function}</p>
                        </div>
                    </div>
                    <button type="button" onClick={onComplete} className="w-full btn-3d btn-primary py-3 text-base">UNDERSTOOD! (+10 Pts)</button>
                </div>
            </div>
        );

        const ScreenStructure = ({ data, locked, onBack, onComplete }) => (
            <div className="flex-1 p-4 bg-brand-teal flex flex-col items-center justify-center">
                <div className="game-card max-w-3xl w-full p-5 animate-pop">
                    {!locked && <button type="button" onClick={onBack} className="text-xs font-black text-slate-500 mb-2">⬅️ Back to Map</button>}
                    <h2 className="text-2xl font-black text-teal-900 text-center mb-4">{data.icon} {data.title}</h2>
                    <div className="space-y-3 mb-4">
                        {data.parts.map((part, i) => (
                            <div key={i} className="bg-white rounded-2xl border-2 border-teal-200 p-3.5 relative overflow-hidden">
                                <div className={`absolute top-0 left-0 w-2 h-full ${i === 0 ? 'bg-orange-400' : 'bg-blue-400'}`}></div>
                                <h3 className={`text-base font-black pl-3 ${i === 0 ? 'text-orange-600' : 'text-blue-600'}`}>{part.name}</h3>
                                <p className="text-slate-600 font-bold text-xs mb-2 pl-3">{part.desc}</p>
                                <div className="bg-slate-100 p-2 rounded-xl ml-3 font-mono text-xs font-bold text-slate-700">Example: {part.example}</div>
                            </div>
                        ))}
                    </div>
                    <button type="button" onClick={onComplete} className="w-full btn-3d btn-primary py-3 text-base">GOT IT! (+10 Pts)</button>
                </div>
            </div>
        );

        const ScreenLangFeatures = ({ data, locked, syncedTab, syncedBy, onSyncTab, onBack, onComplete }) => {
            const [activeTab, setActiveTab] = useState(0);
            useEffect(() => {
                if (typeof syncedTab === 'number') setActiveTab(syncedTab);
            }, [syncedTab]);

            return (
                <div className="flex-1 p-4 bg-brand-purple flex flex-col items-center justify-center">
                    <div className="game-card max-w-3xl w-full p-5 animate-pop">
                        <div className="flex justify-between items-center mb-2">
                            {!locked ? <button type="button" onClick={onBack} className="text-xs font-black text-slate-500">⬅️ Back to Map</button> : <div />}
                            {syncedBy && <span className="bg-emerald-100 text-emerald-800 text-xs font-black px-2 py-0.5 rounded-full">✨ Tab oleh: {syncedBy}</span>}
                        </div>
                        <h2 className="text-2xl font-black text-purple-900 text-center mb-4">{data.icon} {data.title}</h2>
                        <div className="flex flex-wrap gap-2 mb-4 justify-center">
                            {data.features.map((feat, i) => (
                                <button key={i} type="button" onClick={() => { setActiveTab(i); if (onSyncTab) onSyncTab(i); }}
                                    className={`px-3 py-1.5 rounded-xl font-bold text-xs border-2 ${activeTab === i ? 'bg-purple-600 text-white border-purple-800' : 'bg-purple-50 text-purple-700 border-purple-200'}`}>
                                    {feat.title}
                                </button>
                            ))}
                        </div>
                        <div className="bg-slate-50 rounded-2xl border-2 border-slate-200 p-4 mb-4">
                            <ul className="space-y-2 max-w-md mx-auto">
                                {data.features[activeTab].examples.map((ex, i) => (
                                    <li key={i} className="bg-white p-2.5 rounded-xl border border-slate-200 font-bold text-sm text-center text-purple-900">{ex}</li>
                                ))}
                            </ul>
                        </div>
                        <button type="button" onClick={onComplete} className="w-full btn-3d btn-primary py-3 text-base">READY TO EXPLORE! (+10 Pts)</button>
                    </div>
                </div>
            );
        };

        const ScreenTeamProject = ({ user, showModal, onBack, onComplete }) => {
            const [topic, setTopic] = useState('place');
            const [title, setTitle] = useState('');
            const [text, setText] = useState('');

            return (
                <div className="flex-1 p-4 bg-brand-purple flex flex-col items-center justify-center overflow-y-auto">
                    <div className="game-card max-w-3xl w-full p-5 space-y-3">
                        <button type="button" onClick={onBack} className="text-xs font-black text-slate-500">⬅️ Back to Map</button>
                        <h2 className="text-xl font-black text-brand-deep text-center">🤝 TEAM COLLABORATION PROJECT</h2>
                        <div className="flex flex-wrap gap-2 justify-center">
                            {Object.values(WORLDS_DATA).map(w => (
                                <button key={w.id} type="button" onClick={() => setTopic(w.id)}
                                    className={`px-3 py-1.5 rounded-xl font-bold text-xs border-2 ${topic === w.id ? 'bg-brand-yellow border-yellow-600' : 'bg-slate-50 border-slate-200'}`}>
                                    {w.icon} {w.name}
                                </button>
                            ))}
                        </div>
                        <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder={`Title (e.g. ${WORLDS_DATA[topic].subjectTitle})`}
                            className="w-full bg-slate-50 border-2 border-slate-300 rounded-xl p-2.5 text-sm font-bold" />
                        <textarea rows="4" value={text} onChange={e => setText(e.target.value)} placeholder="Write your group Identification & Description here..."
                            className="w-full p-3 rounded-xl border-2 border-slate-300 text-sm font-semibold" />
                        <button type="button" onClick={() => {
                            if (text.trim().length < 20) return showModal("Too Short", "Write at least 2 sentences!", "info");
                            showModal("Project Saved! 🌟", "Great teamwork! (+50 pts)", "success", () => onComplete(50));
                        }} className="w-full btn-3d btn-primary py-3 text-base">💾 SAVE PROJECT (+50 Pts)</button>
                    </div>
                </div>
            );
        };

        const ScreenReflection = ({ onComplete }) => {
            const [conf, setConf] = useState('');
            const [note, setNote] = useState('');
            return (
                <div className="flex-1 p-4 bg-brand-deep flex items-center justify-center">
                    <div className="game-card max-w-xl w-full p-6 space-y-4">
                        <h2 className="text-2xl font-black text-brand-deep text-center">🤔 LET'S REFLECT</h2>
                        <div className="flex flex-col sm:flex-row gap-2">
                            {['Very confident', 'Confident', 'Need more practice'].map(lvl => (
                                <button key={lvl} type="button" onClick={() => setConf(lvl)}
                                    className={`flex-1 py-2.5 rounded-xl border-2 font-bold text-sm ${conf === lvl ? 'bg-brand-sky border-blue-500 text-white' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                                    {lvl}
                                </button>
                            ))}
                        </div>
                        <textarea rows="3" value={note} onChange={e => setNote(e.target.value)} placeholder="What was your favorite activity today?"
                            className="w-full p-3 rounded-xl border-2 border-slate-300 text-sm font-semibold" />
                        <button type="button" onClick={() => onComplete({ confidence: conf, note })} disabled={!conf} className="w-full btn-3d btn-primary py-3 text-base">
                            FINISH ADVENTURE 🏆
                        </button>
                    </div>
                </div>
            );
        };

        const ScreenAchievements = ({ progress, user, onOpenCertificate, onRestart }) => (
            <div className="flex-1 p-5 bg-gradient-to-b from-brand-deep to-slate-900 flex flex-col items-center justify-center text-center">
                <div className="animate-float text-5xl mb-2">🏆</div>
                <h1 className="text-3xl md:text-5xl font-black text-brand-yellow mb-1">CONGRATULATIONS!</h1>
                <p className="text-lg text-white font-bold mb-5">You are a Descriptive Text Detective, {user.name || 'Explorer'}!</p>
                <div className="bg-white/10 p-4 rounded-2xl border border-white/20 mb-5 flex gap-6">
                    <div>
                        <div className="text-xs text-brand-sky font-bold uppercase">Points</div>
                        <div className="text-3xl font-black text-brand-yellow">{progress.points}</div>
                    </div>
                    <div>
                        <div className="text-xs text-brand-sky font-bold uppercase">Stars</div>
                        <div className="text-3xl font-black text-brand-orange">{progress.stars}</div>
                    </div>
                </div>
                <div className="flex flex-wrap gap-3 justify-center">
                    <button type="button" onClick={onOpenCertificate} className="btn-3d btn-primary py-3 px-6 text-base">
                        🏆 Download Sertifikat (PNG/PDF)
                    </button>
                    <button type="button" onClick={onRestart} className="btn-3d bg-white text-brand-deep py-3 px-6 text-base rounded-full">
                        🔄 Play Again
                    </button>
                </div>
            </div>
        );

        const ScreenTeacherDashboard = ({ roomCode, roomData, roomPlayers, teacherName, setTeacherName, onHostRoom, onOpenTeacherMenu, onOpenSharedTask, showModal, onBack }) => {
            const [coHostInput, setCoHostInput] = useState('');

            const handleCreateRoom = () => {
                const newCode = generateRoomCode();
                onHostRoom(newCode, teacherName || 'Guru Utama');
                showModal("Room Baru Dibuat! 🎉", `Kode Murid: ${newCode}\nKode Host (Guru Lain): ${makeHostCode(newCode)}`, "success");
            };

            const handleJoinCoHost = (e) => {
                e.preventDefault();
                const parsed = parseHostCode(coHostInput);
                if (!parsed || parsed.length < 3) {
                    showModal("Kode Host Tidak Valid ❌", "Masukkan Kode Host seperti HOST-AB12CD.", "error");
                    return;
                }
                onHostRoom(parsed, teacherName || 'Guru Co-Host');
                setCoHostInput('');
                showModal("Berhasil Gabung Co-Host! 👩‍🏫", `Anda kini mengontrol Room ${parsed} bersama guru utama.`, "success");
            };

            const toggleFocus = () => {
                if (!roomCode) return;
                window.FB_BRIDGE.upsertRoom(roomCode, {
                    focusMode: !roomData?.focusMode,
                    focusScreen: roomData?.liveScreen && roomData.liveScreen !== 'dashboard' ? roomData.liveScreen : 'map',
                    focusWorld: roomData?.liveWorld || 'people'
                });
            };

            return (
                <div className="flex-1 p-4 bg-slate-100 overflow-y-auto">
                    <div className="max-w-5xl mx-auto space-y-4">
                        <div className="flex flex-wrap justify-between items-center gap-2">
                            <h2 className="text-2xl font-black text-brand-deep">👩‍🏫 Teacher Dashboard & Host Room</h2>
                            <button type="button" onClick={onBack} className="btn-3d btn-danger px-4 py-2 text-xs">
                                🏠 Home
                            </button>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {/* Room Code & Host Code Card */}
                            <div className="game-card p-4 space-y-3">
                                <h3 className="font-black text-brand-deep text-base">🔑 Kelola Kode Room & Co-Host</h3>
                                <div>
                                    <label className="text-xs font-extrabold text-slate-600">Nama Guru:</label>
                                    <input
                                        type="text"
                                        value={teacherName}
                                        onChange={e => setTeacherName(e.target.value)}
                                        className="w-full bg-slate-100 border-2 border-slate-300 rounded-xl p-2 text-sm font-bold mt-0.5"
                                    />
                                </div>
                                <div className="flex gap-2">
                                    <button type="button" onClick={handleCreateRoom} className="flex-1 btn-3d btn-primary py-2.5 text-xs">
                                        ✨ Buat / Ganti Kode Baru
                                    </button>
                                </div>

                                {roomCode && (
                                    <div className="bg-blue-50 border-2 border-blue-200 rounded-xl p-3 space-y-2 text-xs">
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-slate-600">Kode Bergabung Murid:</span>
                                            <button type="button" onClick={() => { copyToClipboard(roomCode); showModal("Disalin!", `Kode Murid ${roomCode} disalin.`, "success"); }} className="font-black text-lg text-brand-deep bg-white px-3 py-0.5 rounded-lg border border-blue-300">
                                                {roomCode} 📋
                                            </button>
                                        </div>
                                        <div className="flex justify-between items-center">
                                            <span className="font-bold text-slate-600">Kode Host (Guru Lain):</span>
                                            <button type="button" onClick={() => { copyToClipboard(makeHostCode(roomCode)); showModal("Disalin!", `Kode Host ${makeHostCode(roomCode)} disalin.`, "success"); }} className="font-black text-sm text-purple-800 bg-purple-100 px-3 py-0.5 rounded-lg border border-purple-300">
                                                {makeHostCode(roomCode)} 📋
                                            </button>
                                        </div>
                                    </div>
                                )}

                                <form onSubmit={handleJoinCoHost} className="pt-2 border-t border-slate-200 flex gap-2">
                                    <input
                                        type="text"
                                        value={coHostInput}
                                        onChange={e => setCoHostInput(e.target.value.toUpperCase())}
                                        placeholder="Gabung Kode Host (HOST-XXXXXX)"
                                        className="flex-1 bg-purple-50 border-2 border-purple-200 rounded-xl px-3 py-2 text-xs font-black uppercase"
                                    />
                                    <button type="submit" className="btn-3d btn-purple px-3 py-2 text-xs">Gabung</button>
                                </form>
                            </div>

                            {/* Live Control Card */}
                            <div className="game-card p-4 space-y-3">
                                <h3 className="font-black text-brand-deep text-base">🎮 Kontrol Kelas Live</h3>
                                <p className="text-xs font-bold text-slate-500">
                                    Aktifkan Mode Fokus agar seluruh murid otomatis mengikuti setiap menu yang Anda buka, atau mulai Papan Drag & Drop Bersama.
                                </p>
                                <div className="grid grid-cols-1 gap-2">
                                    <button
                                        type="button"
                                        disabled={!roomCode}
                                        onClick={toggleFocus}
                                        className={`w-full btn-3d py-3 text-sm ${roomData?.focusMode ? 'btn-danger' : 'btn-purple'}`}
                                    >
                                        {roomData?.focusMode ? '🔓 MATIKAN MODE FOKUS' : '🔒 AKTIFKAN MODE FOKUS'}
                                    </button>
                                    <button
                                        type="button"
                                        disabled={!roomCode}
                                        onClick={() => onOpenTeacherMenu('map')}
                                        className="w-full btn-3d btn-secondary py-3 text-sm"
                                    >
                                        🗺️ BUKA SEMUA MENU GAME (MURID MENGIKUTI)
                                    </button>
                                    <button
                                        type="button"
                                        disabled={!roomCode}
                                        onClick={() => onOpenSharedTask('people')}
                                        className="w-full btn-3d btn-success py-3 text-sm"
                                    >
                                        🧲 MULAI PAPAN DRAG & DROP BERSAMA
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Live Leaderboard */}
                        <div className="game-card p-4">
                            <h3 className="font-black text-brand-deep text-base mb-2">🏆 Peringkat Murid Online ({roomPlayers.length})</h3>
                            {roomPlayers.length === 0 ? (
                                <p className="text-center text-slate-400 font-bold text-xs py-4">Belum ada murid bergabung di Room {roomCode || '-'}.</p>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
                                    {roomPlayers.map((p, idx) => (
                                        <div key={p.uid} className="bg-slate-50 border-2 border-slate-200 rounded-xl p-2.5 flex items-center justify-between">
                                            <div className="flex items-center gap-2">
                                                <span className="font-black text-brand-deep">#{idx + 1}</span>
                                                <span className="text-xl">{p.avatar || '🕵️‍♂️'}</span>
                                                <div>
                                                    <div className="font-black text-sm text-slate-800">{p.name}</div>
                                                    <div className="text-[11px] font-bold text-slate-500">Lv.{p.level || calcLevel(p.points)} • {p.class}</div>
                                                </div>
                                            </div>
                                            <span className="bg-yellow-100 text-yellow-900 font-black px-2.5 py-1 rounded-full text-xs">{p.points || 0} pts</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- RENDER ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
