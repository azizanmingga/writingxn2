    <!-- Real-Time Multiplayer Sync Bridge (BroadcastChannel + LocalStorage Persistence) -->
    <script>
        (function () {
            const STORAGE_PREFIX = 'dta_mp_v2_';
            const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('dta_multiplayer_channel_v2') : null;

            const getUid = () => {
                let id = sessionStorage.getItem('dta_uid');
                if (!id) {
                    id = 'u_' + Math.random().toString(36).slice(2, 10) + '_' + Date.now().toString(36);
                    sessionStorage.setItem('dta_uid', id);
                }
                return id;
            };

            const readJSON = (key, fallback) => {
                try {
                    const raw = localStorage.getItem(STORAGE_PREFIX + key);
                    return raw ? JSON.parse(raw) : fallback;
                } catch (e) {
                    return fallback;
                }
            };

            const writeJSON = (key, value) => {
                try {
                    localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
                } catch (e) {}
            };

            const listeners = new Map();
            const emitLocal = (channelKey, payload) => {
                const set = listeners.get(channelKey);
                if (set) set.forEach(fn => { try { fn(payload); } catch (e) {} });
            };

            const notify = (channelKey, payload) => {
                emitLocal(channelKey, payload);
                if (bc) {
                    try { bc.postMessage({ channelKey, payload }); } catch (e) {}
                }
            };

            if (bc) {
                bc.onmessage = (ev) => {
                    if (ev?.data?.channelKey) {
                        emitLocal(ev.data.channelKey, ev.data.payload);
                    }
                };
            }

            window.addEventListener('storage', (ev) => {
                if (!ev.key || !ev.key.startsWith(STORAGE_PREFIX) || !ev.newValue) return;
                const cleanKey = ev.key.slice(STORAGE_PREFIX.length);
                try {
                    const parsed = JSON.parse(ev.newValue);
                    emitLocal(cleanKey, parsed);
                } catch (e) {}
            });

            const subscribe = (channelKey, cb) => {
                if (!listeners.has(channelKey)) listeners.set(channelKey, new Set());
                listeners.get(channelKey).add(cb);
                return () => {
                    const set = listeners.get(channelKey);
                    if (set) set.delete(cb);
                };
            };

            window.FB_BRIDGE = {
                ready: true,
                uid: getUid(),
                async fetchRoom(roomCode) {
                    return readJSON('room_' + roomCode, null);
                },
                async upsertRoom(roomCode, patch) {
                    const key = 'room_' + roomCode;
                    const prev = readJSON(key, { roomCode, createdAt: Date.now() });
                    const next = { ...prev, ...patch, roomCode, updatedAt: Date.now() };
                    writeJSON(key, next);
                    notify(key, next);
                    return next;
                },
                subscribeRoom(roomCode, cb) {
                    const key = 'room_' + roomCode;
                    const existing = readJSON(key, null);
                    if (existing) cb(existing);
                    return subscribe(key, cb);
                },
                async upsertPlayer(roomCode, uid, playerData) {
                    const key = 'players_' + roomCode;
                    const all = readJSON(key, {});
                    all[uid] = { ...(all[uid] || {}), ...playerData, uid, updatedAt: Date.now() };
                    writeJSON(key, all);
                    const arr = Object.values(all).sort((a, b) => (b.points || 0) - (a.points || 0));
                    notify(key, arr);
                    return arr;
                },
                subscribePlayers(roomCode, cb) {
                    const key = 'players_' + roomCode;
                    const all = readJSON(key, {});
                    cb(Object.values(all).sort((a, b) => (b.points || 0) - (a.points || 0)));
                    return subscribe(key, (payload) => {
                        if (Array.isArray(payload)) cb(payload);
                        else if (payload && typeof payload === 'object') {
                            cb(Object.values(payload).sort((a, b) => (b.points || 0) - (a.points || 0)));
                        }
                    });
                },
                async sendMessage(roomCode, msg) {
                    const key = 'chat_' + roomCode;
                    const list = readJSON(key, []);
                    const next = [...list.slice(-49), { ...msg, id: Date.now() + '_' + Math.random().toString(36).slice(2, 6), ts: Date.now() }];
                    writeJSON(key, next);
                    notify(key, next);
                    return next;
                },
                subscribeMessages(roomCode, cb) {
                    const key = 'chat_' + roomCode;
                    cb(readJSON(key, []));
                    return subscribe(key, cb);
                },
                async broadcastVoice(roomCode, payload) {
                    const key = 'voice_' + roomCode;
                    const data = { ...payload, ts: Date.now() };
                    writeJSON(key, data);
                    notify(key, data);
                },
                subscribeVoice(roomCode, cb) {
                    const key = 'voice_' + roomCode;
                    return subscribe(key, cb);
                }
            };
        })();
    </script>

        // =========================================================================
        // 7. TOP BGM BAR (PIXABAY LOFI + WEB AUDIO FALLBACK + FULLSCREEN TOGGLE)
        // =========================================================================
        const TopAudioBar = () => {
            const [playing, setPlaying] = useState(false);
            const [muted, setMuted] = useState(false);
            const [volume, setVolume] = useState(0.35);
            const [trackIdx, setTrackIdx] = useState(0);
            const [usingSynth, setUsingSynth] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);

            const audioRef = useRef(null);
            const synthRef = useRef({ ctx: null, timer: null, gain: null });

            const stopSynth = useCallback(() => {
                if (synthRef.current.timer) {
                    clearInterval(synthRef.current.timer);
                    synthRef.current.timer = null;
                }
                if (synthRef.current.ctx) {
                    try { synthRef.current.ctx.close(); } catch (e) {}
                    synthRef.current.ctx = null;
                }
            }, []);

            const startSynth = useCallback(() => {
                stopSynth();
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    const ctx = new AudioCtx();
                    const master = ctx.createGain();
                    master.gain.value = muted ? 0 : volume * 0.16;
                    master.connect(ctx.destination);
                    synthRef.current.ctx = ctx;
                    synthRef.current.gain = master;

                    const chords = [
                        [261.63, 329.63, 392.00, 493.88], // Cmaj7
                        [220.00, 261.63, 329.63, 392.00], // Am7
                        [174.61, 220.00, 261.63, 329.63], // Fmaj7
                        [196.00, 246.94, 293.66, 392.00]  // G6
                    ];
                    let step = 0;

                    const playChord = () => {
                        if (!synthRef.current.ctx) return;
                        const now = ctx.currentTime;
                        const notes = chords[step % chords.length];
                        step++;
                        notes.forEach((freq) => {
                            const osc = ctx.createOscillator();
                            const noteGain = ctx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.setValueAtTime(freq, now);
                            noteGain.gain.setValueAtTime(0.001, now);
                            noteGain.gain.exponentialRampToValueAtTime(0.25, now + 0.35);
                            noteGain.gain.exponentialRampToValueAtTime(0.001, now + 2.3);
                            osc.connect(noteGain);
                            noteGain.connect(master);
                            osc.start(now);
                            osc.stop(now + 2.4);
                        });
                    };

                    playChord();
                    synthRef.current.timer = setInterval(playChord, 2400);
                } catch (e) {}
            }, [muted, volume, stopSynth]);

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.volume = muted ? 0 : volume;
                    audioRef.current.muted = muted;
                }
                if (synthRef.current.gain) {
                    synthRef.current.gain.gain.value = muted ? 0 : volume * 0.16;
                }
            }, [volume, muted]);

            useEffect(() => {
                return () => stopSynth();
            }, [stopSynth]);

            const togglePlay = async () => {
                if (playing) {
                    if (audioRef.current) audioRef.current.pause();
                    stopSynth();
                    setPlaying(false);
                    return;
                }
                setPlaying(true);
                if (audioRef.current && !usingSynth) {
                    try {
                        audioRef.current.volume = muted ? 0 : volume;
                        await audioRef.current.play();
                    } catch (e) {
                        setUsingSynth(true);
                        startSynth();
                    }
                } else {
                    startSynth();
                }
            };

            const nextTrack = () => {
                const next = (trackIdx + 1) % BGM_TRACKS.length;
                setTrackIdx(next);
                setUsingSynth(false);
                stopSynth();
                if (playing && audioRef.current) {
                    setTimeout(() => {
                        audioRef.current.play().catch(() => {
                            setUsingSynth(true);
                            startSynth();
                        });
                    }, 80);
                }
            };

            const toggleFullscreen = () => {
                try {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen?.();
                        setIsFullscreen(true);
                    } else {
                        document.exitFullscreen?.();
                        setIsFullscreen(false);
                    }
                } catch (e) {}
            };

            return (
                <div className="bg-slate-950/95 border-b border-slate-800 px-3 py-1 flex items-center justify-between gap-2 text-white text-[11px] shrink-0 z-50">
                    <audio
                        ref={audioRef}
                        src={BGM_TRACKS[trackIdx].url}
                        loop
                        onError={() => {
                            if (playing) {
                                setUsingSynth(true);
                                startSynth();
                            }
                        }}
                    />
                    <div className="hidden sm:flex items-center gap-1.5 text-brand-sky font-extrabold truncate">
                        <span>🎵</span>
                        <span className="truncate">{usingSynth ? 'Lofi Harmonious Synth' : BGM_TRACKS[trackIdx].name}</span>
                    </div>
                    <div className="flex items-center gap-1.5 mx-auto sm:mx-0">
                        <button
                            type="button"
                            onClick={togglePlay}
                            className={`px-2.5 py-0.5 rounded-full font-black border transition ${playing ? 'bg-emerald-500 border-emerald-300 text-slate-950' : 'bg-slate-800 border-slate-600 text-white hover:bg-slate-700'}`}
                        >
                            {playing ? '⏸ Pause' : '▶ BGM'}
                        </button>
                        <button
                            type="button"
                            onClick={() => setMuted(m => !m)}
                            className="px-2 py-0.5 rounded-full bg-slate-800 border border-slate-600 hover:bg-slate-700 font-bold"
                            title="Mute / Unmute"
                        >
                            {muted ? '🔇' : '🔊'}
                        </button>
                        <button
                            type="button"
                            onClick={() => setVolume(v => Math.max(0, +(v - 0.1).toFixed(2)))}
                            className="w-5 h-5 rounded-full bg-slate-800 border border-slate-600 font-black flex items-center justify-center"
                            title="Kecilkan Volume"
                        >
                            −
                        </button>
                        <input
                            type="range"
                            min="0"
                            max="1"
                            step="0.05"
                            value={muted ? 0 : volume}
                            onChange={(e) => {
                                setMuted(false);
                                setVolume(parseFloat(e.target.value));
                            }}

        // =========================================================================
        // 8. WALKIE-TALKIE (PUSH-TO-TALK + ANTI-RESET MIC TEST)
        // =========================================================================
        const WalkieTalkieControl = ({ roomCode, senderName, voiceMuted, onToggleMute, activeSpeaker }) => {
            const [talking, setTalking] = useState(false);
            const [showMicTest, setShowMicTest] = useState(false);
            const [micStatus, setMicStatus] = useState('Klik Mulai Tes untuk menguji mikrofon tanpa me-reset permainan.');
            const [micLevel, setMicLevel] = useState(0);
            const [testingMic, setTestingMic] = useState(false);

            const mediaRecRef = useRef(null);
            const chunksRef = useRef([]);
            const testStreamRef = useRef(null);
            const testRafRef = useRef(null);

            const stopMicTest = () => {
                setTestingMic(false);
                if (testRafRef.current) cancelAnimationFrame(testRafRef.current);
                if (testStreamRef.current) {
                    testStreamRef.current.getTracks().forEach(t => t.stop());
                    testStreamRef.current = null;
                }
                setMicLevel(0);
            };

            const startMicTest = async () => {
                stopMicTest();
                setMicStatus('Meminta izin mikrofon...');
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        setMicStatus('Browser ini tidak mendukung akses mikrofon langsung, namun permainan tetap aman berjalan.');
                        return;
                    }
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    testStreamRef.current = stream;
                    setTestingMic(true);
                    setMicStatus('✅ Mikrofon aktif! Coba ucapkan sesuatu untuk melihat bar suara.');

                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AudioCtx();
                    const src = ctx.createMediaStreamSource(stream);
                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 256;
                    src.connect(analyser);
                    const data = new Uint8Array(analyser.frequencyBinCount);

                    const tick = () => {
                        if (!testStreamRef.current) {
                            try { ctx.close(); } catch (e) {}
                            return;
                        }
                        analyser.getByteFrequencyData(data);
                        const avg = data.reduce((a, b) => a + b, 0) / data.length;
                        setMicLevel(Math.min(100, Math.round(avg * 1.8)));
                        testRafRef.current = requestAnimationFrame(tick);
                    };
                    tick();
                } catch (err) {
                    setMicStatus('⚠️ Izin mikrofon ditolak atau perangkat tidak memiliki mic. Permainan tetap berjalan normal di posisi Anda.');
                }
            };

            const startTalk = async (e) => {
                if (e) e.preventDefault();
                if (!roomCode) return;
                try {
                    if (!navigator.mediaDevices?.getUserMedia) return;
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const rec = new MediaRecorder(stream);
                    chunksRef.current = [];
                    rec.ondataavailable = (ev) => { if (ev.data.size > 0) chunksRef.current.push(ev.data); };
                    rec.onstop = () => {
                        stream.getTracks().forEach(t => t.stop());
                        const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            window.FB_BRIDGE.broadcastVoice(roomCode, {
                                senderUid: window.FB_BRIDGE.uid,
                                senderName,
                                audioDataUrl: reader.result
                            });
                        };
                        reader.readAsDataURL(blob);
                    };
                    mediaRecRef.current = rec;
                    rec.start();
                    setTalking(true);
                } catch (err) {
                    setTalking(false);
                }
            };

            const stopTalk = (e) => {
                if (e) e.preventDefault();
                setTalking(false);
                try {
                    if (mediaRecRef.current && mediaRecRef.current.state !== 'inactive') {
                        mediaRecRef.current.stop();
                    }
                } catch (err) {}
            };

            return (
                <div className="flex items-center gap-1 relative">
                    {roomCode && (
                        <button
                            type="button"
                            onMouseDown={startTalk}
                            onMouseUp={stopTalk}
                            onMouseLeave={() => talking && stopTalk()}
                            onTouchStart={startTalk}
                            onTouchEnd={stopTalk}
                            className={`btn-3d px-2.5 py-1 text-[11px] rounded-lg ${talking ? 'btn-danger animate-pulse' : 'btn-success'}`}
                            title="Tahan tombol untuk berbicara (Walkie-Talkie)"
                        >
                            {talking ? '🔴 Bicara...' : '🎙️ Tahan Bicara'}
                        </button>
                    )}
                    <button
                        type="button"
                        onClick={() => {
                            setShowMicTest(prev => {
                                if (prev) stopMicTest();
                                return !prev;
                            });
                        }}
                        className="btn-3d bg-slate-700 text-white border-2 border-slate-500 shadow-[0_3px_0_#334155] px-2 py-1 text-[11px] rounded-lg"
                        title="Tes Mikrofon Tanpa Reset"
                    >
                        🎧 Tes Mic
                    </button>
                    {roomCode && (
                        <button
                            type="button"
                            onClick={onToggleMute}
                            className="px-2 py-1 rounded-lg bg-slate-800 border border-slate-600 text-xs"
                            title={voiceMuted ? 'Unmute Suara Room' : 'Mute Suara Room'}
                        >
                            {voiceMuted ? '🔇' : '🔊'}
                        </button>
                    )}
                    {activeSpeaker && (
                        <span className="hidden lg:inline-block bg-emerald-500/20 border border-emerald-400 text-emerald-200 text-[10px] font-black px-2 py-0.5 rounded-full animate-pulse">
                            🗣️ {activeSpeaker}
                        </span>
                    )}

                    {/* Floating Non-Resetting Mic Test Overlay */}
                    {showMicTest && (
                        <div className="fixed inset-0 z-[75] flex items-center justify-center bg-slate-900/70 backdrop-blur-sm p-4">
                            <div className="bg-white text-slate-800 rounded-3xl p-5 max-w-sm w-full border-4 border-brand-sky shadow-2xl animate-pop">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-black text-brand-deep text-lg">🎧 Tes Mikrofon</h3>
                                    <button
                                        type="button"
                                        onClick={() => { stopMicTest(); setShowMicTest(false); }}
                                        className="w-8 h-8 rounded-full bg-slate-200 font-black text-slate-700"
                                    >
                                        ✕

                                </div>
                                <p className="text-xs font-bold text-slate-600 mb-3">{micStatus}</p>
                                <div className="w-full h-4 bg-slate-200 rounded-full overflow-hidden mb-4 border border-slate-300">
                                    <div className="h-full bg-emerald-500 transition-all duration-75" style={{ width: `${micLevel}%` }}></div>
                                </div>
                                <div className="flex gap-2">
                                    {!testingMic ? (
                                        <button type="button" onClick={startMicTest} className="flex-1 btn-3d btn-primary py-2 text-xs">
                                            🎙️ Mulai Tes
                                        </button>
                                    ) : (
                                        <button type="button" onClick={stopMicTest} className="flex-1 btn-3d btn-danger py-2 text-xs">
                                            ⏹ Stop Tes
                                        </button>
                                    )}
                                    <button
                                        type="button"
                                        onClick={() => { stopMicTest(); setShowMicTest(false); }}
                                        className="flex-1 btn-3d btn-secondary py-2 text-xs"
                                    >
                                        Tutup

                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // =========================================================================
        // 10. FASTEST CHAMPION CERTIFICATE MODAL (PNG & PDF DOWNLOAD)
        // =========================================================================
        const CertificateModal = ({ player, rank, onClose }) => {
            const canvasRef = useRef(null);

            const drawCertificate = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;

                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#fefce8');
                grad.addColorStop(1, '#e0f2fe');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                ctx.strokeStyle = '#1e3a8a';
                ctx.lineWidth = 14;
                ctx.strokeRect(18, 18, w - 36, h - 36);
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 5;
                ctx.strokeRect(32, 32, w - 64, h - 64);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#1e3a8a';
                ctx.font = '900 34px Nunito, sans-serif';
                ctx.fillText('CERTIFICATE OF ACHIEVEMENT', w / 2, 105);

                ctx.fillStyle = '#0284c7';
                ctx.font = '800 18px Nunito, sans-serif';
                ctx.fillText('DESCRIPTIVE TEXT ADVENTURE • MULTIPLAYER CHAMPION', w / 2, 140);

                ctx.fillStyle = '#475569';
                ctx.font = '700 16px Nunito, sans-serif';
                ctx.fillText('Proudly Awarded To', w / 2, 195);

                ctx.fillStyle = '#0f172a';
                ctx.font = '900 44px Nunito, sans-serif';
                ctx.fillText(player?.name || 'Young Detective', w / 2, 255);

                ctx.fillStyle = '#334155';
                ctx.font = '700 18px Nunito, sans-serif';
                ctx.fillText(`Rank #${rank || 1} • Level ${player?.level || calcLevel(player?.points)} • ${player?.points || 0} Points`, w / 2, 305);
                ctx.fillText(`Class: ${player?.class || 'Grade VII'} • ${new Date().toLocaleDateString()}`, w / 2, 338);

                ctx.fillStyle = '#64748b';
                ctx.font = '700 13px Nunito, sans-serif';
                ctx.fillText('(created by Mingga Ria Hadi NKTHSYP)', w / 2, h - 54);
            }, [player, rank]);

            useEffect(() => { drawCertificate(); }, [drawCertificate]);

            const downloadPNG = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = `Certificate_${(player?.name || 'Champion').replace(/\s+/g, '_')}.png`;
                a.click();
            };

            const downloadPDF = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                if (window.jspdf && window.jspdf.jsPDF) {
                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [800, 520] });
                    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 800, 520);
                    pdf.save(`Certificate_${(player?.name || 'Champion').replace(/\s+/g, '_')}.pdf`);
                } else {
                    downloadPNG();
                }
            };

            return (
                <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/85 backdrop-blur-sm p-4">
                    <div className="bg-white rounded-3xl p-5 max-w-2xl w-full border-4 border-brand-yellow shadow-2xl animate-pop">
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-xl font-black text-brand-deep">🏆 Sertifikat Juara Tercepat</h2>
                            <button type="button" onClick={onClose} className="w-8 h-8 rounded-full bg-slate-200 font-black">✕</button>
                        </div>
                        <canvas ref={canvasRef} width={800} height={520} className="w-full h-auto rounded-2xl border-2 border-slate-200 mb-4" />
                        <div className="flex flex-wrap gap-2 justify-center">
                            <button type="button" onClick={downloadPNG} className="btn-3d btn-primary px-5 py-2.5 text-sm">
                                🖼️ Download PNG
                            </button>
                            <button type="button" onClick={downloadPDF} className="btn-3d btn-secondary px-5 py-2.5 text-sm">
                                📄 Download PDF
                            </button>
                            <button type="button" onClick={onClose} className="btn-3d bg-slate-200 text-slate-700 border-2 border-slate-300 shadow-[0_4px_0_#94a3b8] px-5 py-2.5 text-sm">
                                Tutup

                    </div>

            const [modal, setModal] = useState({ show: false, title: '', message: '', type: 'info', onClose: null });
            const [rewardAnim, setRewardAnim] = useState(null);

            const isStudentFocusLocked = !isTeacherHost && !!roomCode && !!roomData?.focusMode;

            // Persist state automatically so browser refresh never resets progress
            useEffect(() => {
                const snapshot = { screen, activeWorld, user, progress, savedWritings, isTeacherHost, teacherName, roomCode };
                savePersistedSession(snapshot);
            }, [screen, activeWorld, user, progress, savedWritings, isTeacherHost, teacherName, roomCode]);

            // Subscribe to Room, Players, Chat, and Walkie-Talkie Voice
            useEffect(() => {
                if (!roomCode || !window.FB_BRIDGE?.ready) {
                    setRoomData(null);
                    setRoomPlayers([]);
                    setRoomMessages([]);
                    return;
                }
                setConnStatus('online');
                const unsubRoom = window.FB_BRIDGE.subscribeRoom(roomCode, (data) => {
                    if (data) setRoomData(data);
                });
                const unsubPlayers = window.FB_BRIDGE.subscribePlayers(roomCode, (list) => {
                    setRoomPlayers(list || []);

                const unsubChat = window.FB_BRIDGE.subscribeMessages(roomCode, (msgs) => {
                    setRoomMessages(msgs || []);
                });
                const unsubVoice = window.FB_BRIDGE.subscribeVoice(roomCode, (payload) => {

                    setActiveSpeaker(payload.senderName || 'Speaker');

                    if (!voiceMuted && payload.audioDataUrl) {
                        try {
                            const audio = new Audio(payload.audioDataUrl);
                            audio.play().catch(() => {});
                        } catch (e) {}
                    }
                });
                return () => {
                    unsubRoom();
                    unsubPlayers();
                    unsubChat();
                    unsubVoice();
                };
            }, [roomCode, voiceMuted]);

            // Publish Teacher's live screen & focus state
            useEffect(() => {
                if (!roomCode || !isTeacherHost || !window.FB_BRIDGE?.ready) return;
                window.FB_BRIDGE.upsertRoom(roomCode, {
                    roomCode,
                    hostCode: makeHostCode(roomCode),
                    teacherName,
                    liveScreen: screen,
                    liveWorld: activeWorld,
                    focusScreen: roomData?.focusMode ? screen : (roomData?.focusScreen || screen),
                    focusWorld: roomData?.focusMode ? activeWorld : (roomData?.focusWorld || activeWorld)
                });
            }, [roomCode, isTeacherHost, screen, activeWorld, teacherName]);

            // Auto-follow teacher's live screen / shared task when Focus Mode or Shared Task is active
            useEffect(() => {
                if (isTeacherHost || !roomCode || !roomData) return;
                if (screen === 'home' || screen === 'identity' || screen === 'dashboard') return;

                if (roomData.sharedTask?.active) {
                    if (screen !== 'live_shared_task') setScreen('live_shared_task');
                } else if (roomData.focusMode) {
                    if (roomData.focusWorld && roomData.focusWorld !== activeWorld) {
                        setActiveWorld(roomData.focusWorld);
                    }
                    if (roomData.focusScreen && roomData.focusScreen !== screen && roomData.focusScreen !== 'dashboard') {
                        setScreen(roomData.focusScreen);
                    }
                }
            }, [isTeacherHost, roomCode, roomData?.focusMode, roomData?.focusScreen, roomData?.focusWorld, roomData?.sharedTask?.active, screen, activeWorld]);

            // Sync Student Profile & Score to Room
            useEffect(() => {
                if (isTeacherHost || !roomCode || !user.name || !window.FB_BRIDGE?.ready) return;
                window.FB_BRIDGE.upsertPlayer(roomCode, window.FB_BRIDGE.uid, {
                    name: user.name,
                    class: user.class || 'VII',
                    groupName: user.groupName || '',
                    avatar: user.avatar || '🕵️‍♂️',
                    points: progress.points,
                    stars: progress.stars,
                    level: calcLevel(progress.points)
                });
            }, [isTeacherHost, roomCode, user.name, user.class, user.groupName, user.avatar, progress.points, progress.stars]);

            const showModal = (title, message, type = 'info', onClose = null) => {
                setModal({ show: true, title, message, type, onClose });
            };

            const closeModal = () => {
                const cb = modal.onClose;
                setModal({ show: false, title: '', message: '', type: 'info', onClose: null });
                if (cb) cb();
            };

            const addReward = (points, stars, missionId = null) => {
                setProgress(prev => {
                    const alreadyDone = missionId && prev.completed.includes(missionId);
                    const earnedPts = alreadyDone ? 0 : points + (missionId ? 20 : 0);
                    const earnedStars = alreadyDone ? 0 : stars;
                    const newCompleted = (missionId && !alreadyDone) ? [...prev.completed, missionId] : prev.completed;

                    if (earnedPts > 0 || earnedStars > 0) {
                        setRewardAnim({ points: earnedPts, stars: earnedStars });
                        setTimeout(() => setRewardAnim(null), 1600);
                    }
                    return {
                        points: prev.points + earnedPts,
                        stars: prev.stars + earnedStars,
                        completed: newCompleted
                    };
                });
            };

            // Broadcast live activity updates during Focus Mode so everyone sees answers in real time
            const syncLiveActivity = (activityKey, payload) => {
                if (!roomCode || !roomData?.focusMode) return;
                const actor = isTeacherHost ? teacherName : (user.name || 'Student');
                window.FB_BRIDGE.upsertRoom(roomCode, {
                    liveActivity: {
                        ...(roomData.liveActivity || {}),
                        [activityKey]: { ...payload, by: actor, ts: Date.now() }
                    }
                });
            };

            // Student Change Room Code Handlers
            const handleOpenChangeCode = () => {
                setNewRoomCodeInput(roomCode || '');
                setShowChangeCodeModal(true);
            };

            const handleSwitchStudentRoom = async (e) => {
                e.preventDefault();
                const cleanCode = normalizeRoomCode(newRoomCodeInput);
                if (!cleanCode || cleanCode.length < 3) {
                    showModal("Kode Tidak Valid ❌", "Masukkan kode bergabung baru dari guru (minimal 3 karakter, contoh: AB12CD).", "error");
                    return;
                }

                setRoomData(null);
                setRoomPlayers([]);
                setRoomMessages([]);
                setRoomCode(cleanCode);
                setUser(prev => ({ ...prev, roomCode: cleanCode }));
                setIsTeacherHost(false);
                setShowChangeCodeModal(false);
                setNewRoomCodeInput('');

                if (window.FB_BRIDGE?.ready && user.name) {
                    await window.FB_BRIDGE.upsertPlayer(cleanCode, window.FB_BRIDGE.uid, {
                        name: user.name,
                        class: user.class || 'VII',
                        groupName: user.groupName || '',
                        avatar: user.avatar || '🕵️‍♂️',
                        points: progress.points,
                        stars: progress.stars,
                        level: calcLevel(progress.points)
                    });
                    const latestRoom = await window.FB_BRIDGE.fetchRoom(cleanCode);
                    if (latestRoom) {
                        setRoomData(latestRoom);
                        if (latestRoom.sharedTask?.active) {
                            setScreen('live_shared_task');
                        } else if (latestRoom.focusMode) {
                            if (latestRoom.focusWorld) setActiveWorld(latestRoom.focusWorld);
                            if (latestRoom.focusScreen && latestRoom.focusScreen !== 'dashboard') setScreen(latestRoom.focusScreen);
                        } else if (latestRoom.liveScreen && latestRoom.liveScreen !== 'dashboard' && latestRoom.liveScreen !== 'home') {
                            if (latestRoom.liveWorld) setActiveWorld(latestRoom.liveWorld);
                            setScreen(latestRoom.liveScreen);
                        } else {
                            setScreen('map');
                        }
                    } else {
                        setScreen('map');
                    }
                }

                showModal(
                    "Kode Room Diperbarui! 🔑",
                    `Anda kini terhubung ke Room ${cleanCode}. Layar Anda otomatis mengikuti kegiatan yang sedang live dari guru!`,
                    "success"
                );
            };

            const handleGoHome = () => {
                setShowChangeCodeModal(false);
                setScreen('home');
            };

            const toggleFocusMode = () => {
                if (!roomCode || !isTeacherHost) return;
                const nextFocus = !roomData?.focusMode;
                window.FB_BRIDGE.upsertRoom(roomCode, {
                    focusMode: nextFocus,
                    focusScreen: screen === 'dashboard' ? 'map' : screen,
                    focusWorld: activeWorld,
                    sharedTask: { ...(roomData?.sharedTask || {}), active: false }
                });
            };

            const openWorld = (worldId) => {
                if (isStudentFocusLocked) return;
                setActiveWorld(worldId);
                setScreen('world_hub');
            };

            const saveSession = (reflectionData) => {
                try {
                    const history = JSON.parse(localStorage.getItem('dta_teacher_data') || '[]');
                    history.push({
                        date: new Date().toISOString(),
                        user,
                        progress,
                        writings: savedWritings,
                        reflection: reflectionData
                    });
                    localStorage.setItem('dta_teacher_data', JSON.stringify(history));
                } catch (e) {}
            };

            const hideHeaderScreens = ['home', 'identity', 'credits', 'dashboard'];

            const currentPlayerObj = useMemo(() => {
                const found = roomPlayers.find(p => p.uid === window.FB_BRIDGE?.uid);
                return found || { name: user.name || 'Young Detective', class: user.class || 'VII', points: progress.points, level: calcLevel(progress.points) };
            }, [roomPlayers, user, progress.points]);

            const currentRank = useMemo(() => {
                const idx = roomPlayers.findIndex(p => p.uid === window.FB_BRIDGE?.uid);
                return idx >= 0 ? idx + 1 : 1;
            }, [roomPlayers]);

            return (
                <div className="app-shell font-sans relative">
                    {/* Persistent Top Audio & Fullscreen Bar */}
                    <TopAudioBar />

                    {/* Top Navigation Bar */}
                    {!hideHeaderScreens.includes(screen) && (
                        <header className="bg-brand-deep border-b-4 border-blue-950 px-3 py-1.5 z-40 text-white shadow-lg flex flex-wrap justify-between items-center gap-2 shrink-0">
                            <div className="flex items-center gap-2">
                                <button
                                    type="button"
                                    disabled={isStudentFocusLocked}
                                    onClick={() => setScreen(isTeacherHost ? 'map' : 'map')}
                                    className="bg-blue-800 hover:bg-blue-700 p-1.5 rounded-xl border-2 border-blue-600 flex items-center justify-center shadow-inner transition disabled:opacity-50"
                                    title="Adventure Map"
                                >
                                    <span className="text-xl">{isTeacherHost ? '👩‍🏫' : (user.avatar || '🕵️‍♂️')}</span>
                                </button>
                                <div>
                                    <div className="font-black text-sm md:text-base leading-tight">
                                        {isTeacherHost ? teacherName : (user.name || 'Young Detective')}
                                    </div>
                                    <div className="text-brand-sky text-[11px] font-bold uppercase flex items-center gap-1.5">
                                        <span>{isTeacherHost ? 'Teacher Control' : (user.class ? `Class ${user.class}` : 'Grade VII')}</span>
                                        {roomCode && (
                                            <span className="inline-flex items-center gap-1">
                                                • Room {roomCode}
                                                <span className={`inline-block w-2 h-2 rounded-full ${connStatus === 'online' ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                                            </span>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Center: Points, Stars & Walkie-Talkie */}
                            <div className="flex items-center gap-1.5 flex-wrap">
                                {!isTeacherHost && (
                                    <>
                                        <div className="flex items-center gap-1 bg-slate-800/70 px-2.5 py-1 rounded-full border border-slate-700 text-xs">
                                            <IconCoin className="w-4 h-4" />
                                            <span className="font-black text-brand-yellow">{progress.points}</span>
                                        </div>
                                        <div className="flex items-center gap-1 bg-slate-800/70 px-2.5 py-1 rounded-full border border-slate-700 text-xs">
                                            <IconStar className="w-4 h-4 text-brand-orange" />
                                            <span className="font-black text-brand-orange">{progress.stars}</span>
                                        </div>
                                    </>
                                )}
                                <WalkieTalkieControl
                                    roomCode={roomCode}
                                    senderName={isTeacherHost ? teacherName : (user.name || 'Student')}
                                    voiceMuted={voiceMuted}
                                    onToggleMute={() => setVoiceMuted(v => !v)}
                                    activeSpeaker={activeSpeaker}
                                />
                            </div>

                            {/* Right: Navigation, Ganti Kode & Home */}
                            <div className="flex items-center gap-1.5">
                                {!isStudentFocusLocked && (
                                    <button type="button" onClick={() => setScreen('map')} className="hidden sm:flex btn-3d btn-secondary px-2.5 py-1 text-[11px] rounded-lg">
                                        🗺️ Map
                                    </button>
                                )}
                                {isTeacherHost && (
                                    <>
                                        <button
                                            type="button"
                                            onClick={toggleFocusMode}
                                            className={`btn-3d px-2.5 py-1 text-[11px] rounded-lg ${roomData?.focusMode ? 'btn-danger' : 'btn-purple'}`}
                                        >
                                            {roomData?.focusMode ? '🔓 Off Fokus' : '🔒 Mode Fokus'}
                                        </button>
                                        <button type="button" onClick={() => setScreen('dashboard')} className="btn-3d btn-primary px-2.5 py-1 text-[11px] rounded-lg">
                                            👩‍🏫 Dashboard
                                        </button>
                                    </>
                                )}
                                {!isTeacherHost && (
                                    <button
                                        type="button"
                                        onClick={handleOpenChangeCode}
                                        className="btn-3d btn-primary px-2.5 py-1 text-[11px] rounded-lg"
                                        title="Ganti Kode Room Murid"
                                    >
                                        🔑 Ganti Kode
                                    </button>
                                )}
                                <button
                                    type="button"
                                    onClick={handleGoHome}
                                    className="btn-3d btn-danger px-2.5 py-1 text-[11px] rounded-lg"
                                    title="Keluar / Kembali ke Menu Utama"
                                >
                                    🏠 Home
                                </button>
                            </div>
                        </header>
                    )}

                    {/* Focus Mode Status Banner for Students */}
                    {isStudentFocusLocked && !hideHeaderScreens.includes(screen) && (
                        <div className="bg-amber-400 text-amber-950 text-center text-xs font-black py-1 px-3 shrink-0 shadow flex items-center justify-center gap-2">
                            <span>🔒 MODE FOKUS GURU AKTIF — Layar Anda mengikuti guru secara otomatis. Jawaban yang Anda pilih terlihat oleh semua peserta!</span>
                        </div>
                    )}

                    {/* Live Avatars Strip */}
                    {!hideHeaderScreens.includes(screen) && roomCode && (
                        <LiveAvatarStrip
                            players={roomPlayers}
                            currentUid={window.FB_BRIDGE?.uid}
                            onOpenCertificate={() => setShowCertificate(true)}
                        />
                    )}

                    {/* Reward Floating Animation */}
                    {rewardAnim && (
                        <div className="fixed inset-0 pointer-events-none z-50 flex items-center justify-center animate-float">
                            <div className="bg-white/95 backdrop-blur-sm p-5 rounded-3xl shadow-2xl border-4 border-brand-yellow text-center star-spin">
                                <div className="text-3xl mb-1">🎉</div>
                                {rewardAnim.points > 0 && <div className="text-xl font-black text-brand-deep">+{rewardAnim.points} Pts</div>}
                                {rewardAnim.stars > 0 && (
                                    <div className="text-lg font-bold text-brand-orange flex justify-center items-center gap-1">
                                        +{rewardAnim.stars} <IconStar className="w-5 h-5" />
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Global Custom Modal */}
                    {modal.show && (
                        <div className="fixed inset-0 z-[70] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-[0_10px_0_#94a3b8] border-4 border-slate-200 animate-pop">
                                <div className="text-center mb-5">
                                    <div className={`inline-flex items-center justify-center w-16 h-16 rounded-full mb-3 ${
                                        modal.type === 'success' ? 'bg-green-100 text-green-600' :
                                        modal.type === 'error' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'
                                    }`}>
                                        <span className="text-3xl">{modal.type === 'success' ? '✨' : modal.type === 'error' ? '❌' : '💡'}</span>
                                    </div>
                                    <h2 className={`text-2xl font-black ${
                                        modal.type === 'success' ? 'text-green-600' :
                                        modal.type === 'error' ? 'text-red-600' : 'text-brand-deep'
                                    }`}>{modal.title}</h2>
                                    <p className="text-slate-600 font-semibold mt-2 text-sm whitespace-pre-line">{modal.message}</p>
                                </div>
                                <button
                                    type="button"
                                    onClick={closeModal}
                                    className={`w-full btn-3d py-3 text-base ${
                                        modal.type === 'success' ? 'btn-success' :
                                        modal.type === 'error' ? 'btn-danger' : 'btn-primary'
                                    }`}
                                >
                                    Continue
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Main Screen Router (One-Screen Stage) */}
                    <main className="screen-stage relative z-10">
                        {screen === 'home' && (
                            <ScreenHome
                                onStart={() => { setIsTeacherHost(false); setScreen('identity'); }}
                                onTeacher={() => setScreen('dashboard')}
                            />
                        )}
                        {screen === 'identity' && (
                            <ScreenIdentity
                                initialUser={user}
                                onBack={() => setScreen('home')}
                                onComplete={async (data) => {
                                    const cleanCode = normalizeRoomCode(data.roomCode);
                                    setIsTeacherHost(false);
                                    setUser({ ...data, roomCode: cleanCode });
                                    setRoomCode(cleanCode);

                                    if (cleanCode && window.FB_BRIDGE?.ready) {
                                        await window.FB_BRIDGE.upsertPlayer(cleanCode, window.FB_BRIDGE.uid, {
                                            name: data.name,
                                            class: data.class || 'VII',
                                            groupName: data.groupName || '',
                                            avatar: data.avatar || '🕵️‍♂️',
                                            points: progress.points,
                                            stars: progress.stars,
                                            level: calcLevel(progress.points)
                                        });
                                        const latestRoom = await window.FB_BRIDGE.fetchRoom(cleanCode);
                                        if (latestRoom) {
                                            setRoomData(latestRoom);
                                            if (latestRoom.sharedTask?.active) {
                                                setScreen('live_shared_task');
                                                return;
                                            }
                                            if (latestRoom.focusMode && latestRoom.focusScreen && latestRoom.focusScreen !== 'dashboard') {
                                                if (latestRoom.focusWorld) setActiveWorld(latestRoom.focusWorld);
                                                setScreen(latestRoom.focusScreen);
                                                return;
                                            }
                                            if (latestRoom.liveScreen && latestRoom.liveScreen !== 'dashboard' && latestRoom.liveScreen !== 'home') {
                                                if (latestRoom.liveWorld) setActiveWorld(latestRoom.liveWorld);
                                                setScreen(latestRoom.liveScreen);
                                                return;
                                            }
                                        }
                                    }
                                    setScreen('credits');
                                }}
                            />
                        )}
                        {screen === 'credits' && (
                            <ScreenCredits user={user} onNext={() => setScreen('howtoplay')} />
                        )}
                        {screen === 'howtoplay' && <ScreenHowToPlay onNext={() => setScreen('objectives')} />}
                        {screen === 'objectives' && <ScreenObjectives onNext={() => setScreen('map')} />}
                        {screen === 'map' && (
                            <ScreenMap
                                progress={progress}
                                locked={isStudentFocusLocked}
                                onSelect={(s) => !isStudentFocusLocked && setScreen(s)}
                                onOpenWorld={openWorld}
                            />
                        )}

                        {/* Base Camp Materials */}
                        {screen === 'mat_def' && (
                            <ScreenMaterial
                                data={MATERIAL_CONTENT.def}
                                locked={isStudentFocusLocked}
                                onBack={() => setScreen('map')}
                                onComplete={() => { addReward(10, 1, 'mat_def'); if (!isStudentFocusLocked) setScreen('map'); }}
                            />
                        )}
                        {screen === 'mat_struct' && (
                            <ScreenStructure
                                data={MATERIAL_CONTENT.structure}
                                locked={isStudentFocusLocked}
                                onBack={() => setScreen('map')}
                                onComplete={() => { addReward(10, 1, 'mat_struct'); if (!isStudentFocusLocked) setScreen('map'); }}
                            />
                        )}
                        {screen === 'mat_lang' && (
                            <ScreenLangFeatures
                                data={MATERIAL_CONTENT.lang}
                                locked={isStudentFocusLocked}
                                syncedTab={roomData?.focusMode ? roomData?.liveActivity?.mat_lang?.tab : undefined}
                                syncedBy={roomData?.focusMode ? roomData?.liveActivity?.mat_lang?.by : ''}
                                onSyncTab={(tab) => syncLiveActivity('mat_lang', { tab })}
                                onBack={() => setScreen('map')}
                                onComplete={() => { addReward(10, 1, 'mat_lang'); if (!isStudentFocusLocked) setScreen('map'); }}
                            />
                        )}

                        {/* World Hub & 5 Topic Stages */}
                        {screen === 'world_hub' && (
                            <ScreenWorldHub
                                world={WORLDS_DATA[activeWorld]}
                                progress={progress}
                                locked={isStudentFocusLocked}
                                onBack={() => setScreen('map')}
                                onSelectStage={(stage) => !isStudentFocusLocked && setScreen(`world_${stage}`)}
                            />
                        )}
                        {screen === 'world_material' && (
                            <ScreenTopicMaterial
                                world={WORLDS_DATA[activeWorld]}
                                locked={isStudentFocusLocked}
                                onBack={() => setScreen('world_hub')}
                                onComplete={() => { addReward(20, 1, `${activeWorld}_material`); if (!isStudentFocusLocked) setScreen('world_vocab'); }}
                            />
                        )}
                        {screen === 'world_vocab' && (
                            <ScreenDragDropSorter
                                world={WORLDS_DATA[activeWorld]}
                                locked={isStudentFocusLocked}
                                syncedState={roomData?.focusMode ? roomData?.liveActivity?.[`vocab_${activeWorld}`] : null}
                                onSyncState={(payload) => syncLiveActivity(`vocab_${activeWorld}`, payload)}
                                showModal={showModal}
                                onBack={() => setScreen('world_hub')}
                                onComplete={() => { addReward(40, 1, `${activeWorld}_vocab`); if (!isStudentFocusLocked) setScreen('world_grammar'); }}
                            />
                        )}
                        {screen === 'world_grammar' && (
                            <ScreenGrammar
                                data={WORLDS_DATA[activeWorld].grammar}
                                title={`${WORLDS_DATA[activeWorld].name}: Grammar Detective`}
                                world={WORLDS_DATA[activeWorld]}
                                locked={isStudentFocusLocked}
                                syncedState={roomData?.focusMode ? roomData?.liveActivity?.[`grammar_${activeWorld}`] : null}
                                onSyncState={(payload) => syncLiveActivity(`grammar_${activeWorld}`, payload)}
                                showModal={showModal}
                                onBack={() => setScreen('world_hub')}
                                onComplete={() => { addReward(40, 1, `${activeWorld}_grammar`); if (!isStudentFocusLocked) setScreen('world_sentence'); }}
                            />
                        )}
                        {screen === 'world_sentence' && (
                            <ScreenSentenceBuilder
                                world={WORLDS_DATA[activeWorld]}
                                locked={isStudentFocusLocked}
                                syncedState={roomData?.focusMode ? roomData?.liveActivity?.[`sentence_${activeWorld}`] : null}
                                onSyncState={(payload) => syncLiveActivity(`sentence_${activeWorld}`, payload)}
                                showModal={showModal}
                                onBack={() => setScreen('world_hub')}
                                onComplete={() => { addReward(40, 1, `${activeWorld}_sentence`); if (!isStudentFocusLocked) setScreen('world_writing'); }}
                            />
                        )}
                        {screen === 'world_writing' && (
                            <ScreenWritingBuilder
                                world={WORLDS_DATA[activeWorld]}
                                locked={isStudentFocusLocked}
                                syncedState={roomData?.focusMode ? roomData?.liveActivity?.[`writing_${activeWorld}`] : null}
                                onSyncState={(payload) => syncLiveActivity(`writing_${activeWorld}`, payload)}
                                showModal={showModal}
                                onBack={() => setScreen('world_hub')}
                                onSaveWriting={(paragraph) => {
                                    setSavedWritings(prev => ({ ...prev, [activeWorld]: paragraph }));
                                }}
                                onComplete={() => { addReward(50, 2, `${activeWorld}_writing`); if (!isStudentFocusLocked) setScreen('world_hub'); }}
                            />
                        )}

                        {/* Live Shared Drag & Drop Board */}
                        {screen === 'live_shared_task' && (
                            <ScreenLiveSharedTask
                                roomCode={roomCode}
                                roomData={roomData}
                                isTeacherHost={isTeacherHost}
                                actorName={isTeacherHost ? teacherName : (user.name || 'Student')}
                                onBack={() => setScreen(isTeacherHost ? 'dashboard' : 'map')}
                            />
                        )}

                        {/* Team Project & Final Boss */}
                        {screen === 'team_project' && (
                            <ScreenTeamProject
                                user={user}
                                showModal={showModal}
                                onBack={() => setScreen('map')}
                                onComplete={(pts) => { addReward(pts, 2, 'team_project'); setScreen('map'); }}
                            />
                        )}
                        {screen === 'final_challenge' && (
                            <ScreenGrammar
                                data={FINAL_CHALLENGE}
                                title="THE FINAL DESCRIPTIVE CHALLENGE"
                                isFinal={true}
                                showModal={showModal}
                                onBack={() => setScreen('map')}
                                onComplete={() => { addReward(100, 3, 'final_challenge'); setScreen('reflection'); }}
                            />
                        )}
                        {screen === 'reflection' && (
                            <ScreenReflection
                                onComplete={(reflData) => {
                                    saveSession(reflData);
                                    setScreen('achievements');
                                }}
                            />
                        )}
                        {screen === 'achievements' && (
                            <ScreenAchievements
                                progress={progress}
                                user={user}
                                onOpenCertificate={() => setShowCertificate(true)}
                                onRestart={() => {
                                    sessionStorage.removeItem(SESSION_KEY);
                                    localStorage.removeItem(SESSION_KEY);
                                    setScreen('home');
                                }}
                            />
                        )}
                        {screen === 'dashboard' && (
                            <ScreenTeacherDashboard
                                roomCode={roomCode}
                                roomData={roomData}
                                roomPlayers={roomPlayers}
                                teacherName={teacherName}
                                setTeacherName={setTeacherName}
                                onHostRoom={(code, tName) => {
                                    const clean = normalizeRoomCode(code);
                                    setIsTeacherHost(true);
                                    setTeacherName(tName || 'Guru Utama');
                                    setRoomCode(clean);
                                    window.FB_BRIDGE.upsertRoom(clean, {
                                        roomCode: clean,
                                        hostCode: makeHostCode(clean),
                                        teacherName: tName || 'Guru Utama',
                                        focusMode: false,
                                        liveScreen: 'map',
                                        liveWorld: activeWorld
                                    });
                                }}
                                onOpenTeacherMenu={(targetScreen = 'map') => {
                                    setIsTeacherHost(true);
                                    setScreen(targetScreen);
                                }}
                                onOpenSharedTask={(worldId) => {
                                    if (!roomCode) return;
                                    setIsTeacherHost(true);
                                    window.FB_BRIDGE.upsertRoom(roomCode, {
                                        sharedTask: {
                                            active: true,
                                            worldId: worldId || activeWorld,
                                            placements: {}
                                        }
                                    });
                                    setScreen('live_shared_task');
                                }}
                                showModal={showModal}
                                onBack={() => setScreen('home')}
                            />
                        )}
                    </main>

                    {/* Floating Minimizable Student List & Chat */}
                    {!hideHeaderScreens.includes(screen) && (
                        <FloatingMultiplayerPanels
                            roomCode={roomCode}
                            players={roomPlayers}
                            messages={roomMessages}
                            senderName={isTeacherHost ? teacherName : (user.name || 'Student')}
                            currentUid={window.FB_BRIDGE?.uid}
                        />
                    )}

                    {/* Certificate Modal */}
                    {showCertificate && (
                        <CertificateModal
                            player={currentPlayerObj}
                            rank={currentRank}
                            onClose={() => setShowCertificate(false)}
                        />
                    )}

                    {/* Modal Ganti Kode Room Murid */}
                    {showChangeCodeModal && (
                        <div className="fixed inset-0 z-[75] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
                            <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-[0_10px_0_#94a3b8] border-4 border-slate-200 animate-pop">
                                <div className="text-center mb-4">
                                    <div className="inline-flex items-center justify-center w-14 h-14 rounded-full bg-blue-100 text-3xl mb-2">
                                        🔑
                                    </div>
                                    <h2 className="text-2xl font-black text-brand-deep">GANTI KODE ROOM</h2>
                                    <p className="text-slate-600 font-bold text-xs mt-1">
                                        Masukkan kode baru dari guru agar layar Anda otomatis mengikuti kegiatan yang sedang live.
                                    </p>
